[project]
name = "llms-en-accion-proyecto"
version = "0.1.0"
description = "Mi asistente — LLMs en Acción (UCU)"
requires-python = ">=3.12,<3.13"
# Versiones probadas el 2026-10-15. No subirlas a mitad de curso sin probar.
dependencies = [
    "langchain==1.4.6",
    "langchain-core==1.6.10",
    "langgraph==1.2.15",
    "langchain-openai==1.7.2",
    "langchain-anthropic==1.7.6",
    "langchain-google-genai==4.4.2",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.3",
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "ddgs==9.16.0",
    "langfuse==5.0.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "marimo==0.25.1",
    "pandas==3.0.6",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
